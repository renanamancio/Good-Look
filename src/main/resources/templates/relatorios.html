<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios de Performance | Test Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="admin-body">

<header class="admin-header reveal">
    <div class="brand">
        <span class="brand-text">Painel de Curadoria</span>
    </div>
    <nav class="admin-nav">
        <a href="/admin/home">Home</a>
        <a href="/admin/usuarios">Usuários</a>
        <a href="/admin/produtos">Produtos</a>
        <a href="/admin/relatorios" class="active">Relatórios</a>
    </nav>
    <div class="header-actions">
        <a href="javascript:void(0)" onclick="logout()" class="btn-outline btn-small">Logout</a>
    </div>
</header>

<main class="admin-main">

    <section class="welcome-section reveal" style="text-align: left; margin-bottom: 4rem;">
        <h1 class="hero-title">Logs de Auditoria</h1>
        <p class="subtitle">Acompanhe as ações realizadas no sistema para rastreabilidade.</p>
    </section>

    <section class="report-details-section reveal">
        <div class="report-card">
            <h2 class="report-section-title">Histórico Recente</h2>
            <table border="1" style="width: 100%; margin-top: 2rem; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Usuário</th>
                        <th>Ação</th>
                        <th>Detalhes</th>
                    </tr>
                </thead>
                <tbody id="tabelaLogs">
                    {#for log in logs}
                    <tr>
                        <td>{log.dataHora}</td>
                        <td>{log.usuarioEmail}</td>
                        <td>{log.acao}</td>
                        <td>{log.detalhes}</td>
                    </tr>
                    {/for}
                </tbody>
            </table>
        </div>
    </section>

</main>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
