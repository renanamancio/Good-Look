<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listar Produtos | Test Shop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body class="admin-body">

<header class="admin-header reveal">
  <div class="brand">
    <span class="brand-text">Painel de Curadoria</span>
  </div>
  <nav class="admin-nav">
    <a href="/admin/home">Home</a>
    <a href="/admin/usuarios">Usuários</a>
    <a href="/admin/produtos" class="active">Produtos</a>
    <a href="/admin/relatorios">Relatórios</a>
  </nav>
  <div class="header-actions">
    <a href="javascript:void(0)" onclick="logout()" class="btn-outline btn-small">Logout</a>
  </div>
</header>

<main class="admin-main">

  <section class="welcome-section reveal" style="text-align: left; margin-bottom: 3rem;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 class="hero-title">Acervo de Peças</h1>
        <p class="subtitle">Gestão de inventário, curadoria e visibilidade do catálogo.</p>
      </div>
      <a href="/admin/produtos/cadastrar" class="btn-primary" style="padding: 12px 32px; font-size: 0.875rem;">Nova Peça</a>
    </div>
  </section>

  <div class="admin-table-wrapper reveal">
    <table class="luxury-table">
      <thead>
      <tr>
        <th>Produto</th>
        <th>URL (Slug)</th>
        <th>Valor (R$)</th>
        <th>Estoque</th>
        <th style="text-align: right;">Ações</th>
      </tr>
      </thead>
      <tbody id="tabelaProdutos">
      {#for p in listaProdutos}
      <tr id="row-{p.id}">
        <td>
          <div class="product-profile-cell">
            <div class="product-thumb" style="background-image: url('{p.imagem}'); background-size: cover;"></div>
            <div class="product-info">
              <span class="product-name">{p.nome}</span>
            </div>
          </div>
        </td>
        <td class="product-category">{p.url}</td>
        <td class="product-price">{p.preco}</td>
        <td class="product-stock">{p.quantidade} unid.</td>
        <td class="table-actions">
          <button class="action-link delete" data-action="delete-produto" data-id="{p.id}">Excluir</button>
        </td>
      </tr>
      {/for}
      </tbody>
    </table>
  </div>

</main>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
