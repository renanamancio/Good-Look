<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Usuários | Test Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../..../../assets/css/main.css">
</head>
<body class="admin-body">

<header class="admin-header reveal">
    <div class="brand">
        <span class="brand-text">Painel de Curadoria</span>
    </div>
    <nav class="admin-nav">
        <a href="/admin/home">Home</a>
        <a href="/admin/usuarios" class="active">Usuários</a>
        <a href="/admin/produtos">Produtos</a>
        <a href="/admin/relatorios">Relatórios</a>
    </nav>
    <div class="header-actions">
        <a href="javascript:void(0)" onclick="logout()" class="btn-outline btn-small">Logout</a>
    </div>
</header>

<main class="admin-main">

    <section class="welcome-section reveal" style="text-align: left; margin-bottom: 3rem;">
        <h1 class="hero-title">Usuários Cadastrados</h1>
        <p class="subtitle">Gerenciamento de acessos, perfis e informações de clientes da plataforma.</p>
    </section>

    <div class="admin-table-wrapper reveal">
        <table class="luxury-table">
            <thead>
            <tr>
                <th>E-mail</th>
                <th>Perfil</th>
                <th style="text-align: right;">Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaUsuarios">
            {#for u in listaUsuarios}
            <tr id="row-{u.id}">
                <td class="user-email">{u.email}</td>
                <td>
                    <span class="badge-luxury">{u.role}</span>
                </td>
                <td class="table-actions">
                    <button class="action-link delete" data-action="delete-usuario" data-id="{u.id}">Excluir</button>
                </td>
            </tr>
            {/for}
            </tbody>
        </table>
    </div>

</main>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
